name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.instantiate()'
      - name: Build and run doctests
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  extension:
    name: NonMarkovEvolution extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # Not Pkg.test: NonMarkovEvolution is only a weak dependency, so it is not in the
      # package's [deps] and the Pkg.test sandbox could never load it. A temporary
      # environment with both packages developed lets the extension load.
      - run: |
          julia -e '
            using Pkg
            Pkg.activate(temp = true)
            Pkg.develop(path = pwd())
            Pkg.develop(url = "https://github.com/alexsteininfo/NonMarkovEvolution.jl")
            Pkg.add(["Test", "Distributions", "Aqua", "AbstractTrees", "REPL"])
            include(joinpath(pwd(), "test", "runtests.jl"))'
